<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Karyawan - Heavenly Blush</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-[100dvh] flex flex-col justify-between p-2 sm:p-6">

  <div class="w-full max-w-lg mx-auto bg-white rounded-2xl sm:rounded-3xl shadow-xl border border-slate-100 overflow-hidden flex flex-col my-auto">
    
    <!-- Header with Logo -->
    <div class="bg-slate-900 text-white p-6 sm:p-8 text-center relative overflow-hidden">
      <!-- PWA Install Button -->
      <button id="install-btn" class="hidden absolute top-4 right-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition-all flex items-center gap-1.5 z-10">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Install App
      </button>

      <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl"></div>
      <img src="https://heavenlyblush.com/wp-content/uploads/2022/03/cropped-Logo_hb_2022-2-1.png" alt="Heavenly Blush Logo" class="h-10 sm:h-12 mx-auto mb-3 filter brightness-0 invert object-contain">
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Portal Absensi Karyawan</h1>
      <p id="realtime-clock" class="text-xs sm:text-sm text-indigo-200 mt-1 font-medium">Memuat waktu...</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-100 bg-slate-50/50 p-2 gap-2">
      <button onclick="switchTab('form')" id="btn-tab-form" class="flex-1 py-3 text-xs sm:text-sm font-semibold rounded-2xl transition-all bg-white text-indigo-600 shadow-sm">
        Form Absen
      </button>
      <button onclick="switchTab('history')" id="btn-tab-history" class="flex-1 py-3 text-xs sm:text-sm font-semibold rounded-2xl transition-all text-slate-500 hover:text-slate-800">
        Riwayat (7 Hari)
      </button>
    </div>

    <!-- Tab 1: Form Absensi -->
    <div id="tab-form" class="tab-content active p-6 sm:p-8 space-y-5">
      <!-- Reminder Banner -->
      <div id="reminder-banner" class="hidden p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-xs sm:text-sm font-medium flex items-center gap-3">
        <svg class="w-5 h-5 text-amber-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span id="reminder-text">Pengingat: Jangan lupa absen hari ini!</span>
      </div>

      <form id="attendanceForm" onsubmit="event.preventDefault(); handleAttendance();" class="space-y-5">
        <div>
          <label class="block text-xs sm:text-sm font-semibold uppercase tracking-wider text-slate-500 mb-2">Email Karyawan</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
            </span>
            <input type="email" id="email" required placeholder="nama@heavenlyblush.com" oninput="onEmailInput()"
              class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-semibold uppercase tracking-wider text-slate-500 mb-2">Catatan / Keterangan</label>
          <textarea id="notes" rows="3" placeholder="Opsional (misal: WFH, Dinas Luar)..."
            class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all resize-none"></textarea>
        </div>

        <button type="submit" id="action-btn" class="w-full py-4 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold text-base rounded-2xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2.5">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
          <span id="action-btn-text">Absen Masuk</span>
        </button>
      </form>
    </div>

    <!-- Tab 2: Riwayat Aktivitas & Filter Email -->
    <div id="tab-history" class="tab-content p-6 sm:p-8 space-y-5">
      <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-500">Aktivitas 7 Hari Terakhir</h2>
          <button onclick="loadHistory()" class="text-xs sm:text-sm text-indigo-600 hover:underline font-medium">Muat Ulang</button>
        </div>
        
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Filter Berdasarkan Email</label>
          <select id="email-filter" onchange="filterHistoryByEmail()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs sm:text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            <option value="">-- Masukkan Email di Form Utama --</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto rounded-2xl border border-slate-100 max-h-80 overflow-y-auto">
        <table class="w-full text-left text-xs sm:text-sm min-w-[320px]">
          <thead class="bg-slate-50 text-slate-600 sticky top-0 border-b border-slate-100">
            <tr>
              <th class="p-3.5 font-semibold">Hari, Tanggal</th>
              <th class="p-3.5 font-semibold">Masuk</th>
              <th class="p-3.5 font-semibold">Keluar</th>
              <th class="p-3.5 font-semibold text-center">Status</th>
            </tr>
          </thead>
          <tbody id="history-table-body" class="divide-y divide-slate-100">
            <tr>
              <td colspan="4" class="p-6 text-center text-slate-400">Masukkan email di form utama terlebih dahulu.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer Branding -->
    <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-400 font-medium">
      © 2026 • Absensi Digital • Heavenly Blush
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 -translate-y-20 opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-3 px-5 py-4 rounded-2xl bg-white shadow-2xl border border-slate-100 min-w-[300px] max-w-[90vw]">
    <div id="toast-icon-wrapper" class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0"></div>
    <div>
      <h4 id="toast-title" class="text-xs sm:text-sm font-bold text-slate-900"></h4>
      <p id="toast-message" class="text-xs text-slate-500 mt-0.5"></p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0kJI9MILSLdJjM1Vj2qUE31JPhYJXeSeeyZTs-nYO3gx7iCfb4MiSk156iH2dKTQBGg/exec";
    let globalHistoryData = [];

    // PWA Install Prompt Handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('install-btn');
      installBtn.classList.remove('hidden');
      installBtn.addEventListener('click', () => {
        installBtn.classList.add('hidden');
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      });
    });

    if ('serviceWorker' in navigator) {
      const pwaManifest = {
        "name": "Absensi Karyawan Heavenly Blush",
        "short_name": "Absensi",
        "start_url": "./",
        "display": "standalone",
        "background_color": "#f8fafc",
        "theme_color": "#4f46e5",
        "icons": [{
          "src": "https://heavenlyblush.com/wp-content/uploads/2022/03/cropped-Logo_hb_2022-2-1.png",
          "sizes": "192x192",
          "type": "image/png"
        }]
      };
      const blob = new Blob([JSON.stringify(pwaManifest)], {type: 'application/json'});
      const manifestURL = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestURL;
      document.head.appendChild(link);

      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], {type: 'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error:', err));
    }

    // Real-time Clock & Reminder Logic
    function updateRealtimeClock() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('realtime-clock').textContent = now.toLocaleDateString('id-ID', options);
      checkReminders(now);
    }
    setInterval(updateRealtimeClock, 1000);
    updateRealtimeClock();

    function checkReminders(now) {
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const banner = document.getElementById('reminder-banner');
      const text = document.getElementById('reminder-text');

      const todayStr = now.toISOString().slice(0, 10);
      const lastCheckedDate = localStorage.getItem('last_attendance_date');
      const isCheckedInToday = (lastCheckedDate === todayStr);

      if (hours === 7 && !isCheckedInToday) {
        banner.classList.remove('hidden');
        text.textContent = "Pengingat: Jangan lupa absen masuk hari ini!";
      } else if (hours === 16 && minutes >= 55) {
        banner.classList.remove('hidden');
        text.textContent = "Jangan lupa absen pulang!";
      } else {
        banner.classList.add('hidden');
      }
    }

    // Tab Switching Logic
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('btn-tab-form').className = "flex-1 py-3 text-xs sm:text-sm font-semibold rounded-2xl transition-all text-slate-500 hover:text-slate-800";
      document.getElementById('btn-tab-history').className = "flex-1 py-3 text-xs sm:text-sm font-semibold rounded-2xl transition-all text-slate-500 hover:text-slate-800";

      if (tabName === 'form') {
        document.getElementById('tab-form').classList.add('active');
        document.getElementById('btn-tab-form').className = "flex-1 py-3 text-xs sm:text-sm font-semibold rounded-2xl transition-all bg-white text-indigo-600 shadow-sm";
      } else {
        document.getElementById('tab-history').classList.add('active');
        document.getElementById('btn-tab-history').className = "flex-1 py-3 text-xs sm:text-sm font-semibold rounded-2xl transition-all bg-white text-indigo-600 shadow-sm";
        syncEmailDropdownAndLoad();
      }
    }

    // Toast Notification System
    function showToast(type, title, message) {
      const toast = document.getElementById('toast');
      const iconWrap = document.getElementById('toast-icon-wrapper');
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-message').textContent = message;

      if (type === 'success') {
        iconWrap.className = "w-9 h-9 rounded-xl flex items-center justify-center shrink-0 bg-emerald-50 text-emerald-600";
        iconWrap.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
      } else {
        iconWrap.className = "w-9 h-9 rounded-xl flex items-center justify-center shrink-0 bg-rose-50 text-rose-600";
        iconWrap.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;
      }

      toast.style.transform = "translateX(-50%) translateY(0)";
      toast.style.opacity = "1";
      setTimeout(() => {
        toast.style.transform = "translateX(-50%) translateY(-20px)";
        toast.style.opacity = "0";
      }, 4000);
    }

    // LocalStorage State Management
    function checkAttendanceStateOnLoad() {
      const savedEmail = localStorage.getItem('user_email');
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
      }

      const todayStr = new Date().toISOString().slice(0, 10);
      const lastDate = localStorage.getItem('last_attendance_date');
      const lastState = localStorage.getItem('attendance_state');

      if (lastDate === todayStr && lastState === 'Pulang') {
        setButtonState('Pulang');
      } else {
        setButtonState('Masuk');
        if (lastDate !== todayStr) {
          localStorage.removeItem('attendance_state');
        }
      }
    }

    function onEmailInput() {
      const email = document.getElementById('email').value.trim();
      if (email) {
        localStorage.setItem('user_email', email);
      }
    }

    function setButtonState(state) {
      const btn = document.getElementById('action-btn');
      const btnText = document.getElementById('action-btn-text');

      if (state === 'Pulang') {
        btn.className = "w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold text-base rounded-2xl shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2.5";
        btnText.textContent = "Absen Pulang";
      } else {
        btn.className = "w-full py-4 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold text-base rounded-2xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2.5";
        btnText.textContent = "Absen Masuk";
      }
    }

    window.addEventListener('DOMContentLoaded', checkAttendanceStateOnLoad);

    // Handle Attendance Process
    function handleAttendance() {
      const email = document.getElementById('email').value.trim();
      const notes = document.getElementById('notes').value.trim();

      if (!email) {
        showToast('error', 'Validasi Gagal', 'Harap masukkan email Anda terlebih dahulu.');
        return;
      }

      const btnTextCurrent = document.getElementById('action-btn-text').textContent;
      const type = btnTextCurrent.includes('Pulang') ? 'Pulang' : 'Masuk';

      if (navigator.geolocation) {
        showToast('success', 'Mendeteksi Lokasi', 'Mengambil titik koordinat GPS...');
        navigator.geolocation.getCurrentPosition(
          (position) => {
            sendDataToSheet(email, position.coords.latitude + ", " + position.coords.longitude, type, notes);
          },
          (error) => {
            showToast('error', 'Gagal GPS', 'Pastikan izin akses lokasi aktif pada perangkat Anda.');
          },
          { timeout: 10000 }
        );
      } else {
        showToast('error', 'Tidak Didukung', 'Browser Anda tidak mendukung geolokasi.');
      }
    }

    function sendDataToSheet(email, location, type, notes) {
      if (SCRIPT_URL.includes("URL_WEB_APP_GOOGLE_SCRIPT_ANDA_DISINI")) {
        setTimeout(() => {
          processUIAfterSuccess(email, type);
        }, 800);
        return;
      }

      const formData = new URLSearchParams();
      formData.append('email', email);
      formData.append('location', location);
      formData.append('type', type);
      formData.append('notes', notes);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          processUIAfterSuccess(email, type);
        } else {
          showToast('error', 'Gagal Server', res.message || 'Terjadi kesalahan pada server.');
        }
      })
      .catch((err) => {
        showToast('success', 'Berhasil Dicatat', `Absen ${type} berhasil dikirim.`);
        processUIAfterSuccess(email, type);
      });
    }

    function processUIAfterSuccess(email, type) {
      showToast('success', 'Berhasil!', `Absen ${type} berhasil dicatat.`);
      
      const todayStr = new Date().toISOString().slice(0, 10);
      localStorage.setItem('last_attendance_date', todayStr);
      localStorage.setItem('user_email', email);

      if (type === 'Masuk') {
        localStorage.setItem('attendance_state', 'Pulang');
        setButtonState('Pulang');
      } else {
        localStorage.setItem('attendance_state', 'Selesai');
        setButtonState('Masuk');
        document.getElementById('attendanceForm').reset();
        document.getElementById('email').value = email;
      }
    }

    function syncEmailDropdownAndLoad() {
      const emailInput = document.getElementById('email').value.trim();
      const select = document.getElementById('email-filter');
      
      if (emailInput) {
        select.innerHTML = `<option value="${emailInput}">${emailInput}</option>`;
        select.value = emailInput;
      }

      loadHistory();
    }

    function loadHistory() {
      const tbody = document.getElementById('history-table-body');
      const emailSelect = document.getElementById('email-filter').value.trim();

      if (!emailSelect) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Masukkan email di form utama terlebih dahulu.</td></tr>`;
        return;
      }

      tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Memuat riwayat...</td></tr>`;

      if (SCRIPT_URL.includes("URL_WEB_APP_GOOGLE_SCRIPT_ANDA_DISINI")) {
        setTimeout(() => {
          globalHistoryData = [
            { date: "17/08/2026", email: emailSelect, inTime: "08:00", outTime: "17:00" },
            { date: "16/08/2026", email: emailSelect, inTime: "08:05", outTime: "-" },
            { date: "15/08/2026", email: emailSelect, inTime: "07:55", outTime: "17:02" }
          ];
          filterHistoryByEmail();
        }, 500);
        return;
      }

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success' && res.data) {
            globalHistoryData = res.data;
            filterHistoryByEmail();
          } else {
            tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada data riwayat.</td></tr>`;
          }
        })
        .catch(err => {
          tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-rose-400">Gagal memuat data dari server.</td></tr>`;
        });
    }

    function filterHistoryByEmail() {
      const selectedEmail = document.getElementById('email-filter').value.trim();
      const tbody = document.getElementById('history-table-body');

      if (!selectedEmail) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Masukkan email di form utama terlebih dahulu.</td></tr>`;
        return;
      }

      const filtered = globalHistoryData.filter(item => item.email && item.email.toLowerCase() === selectedEmail.toLowerCase());

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada riwayat absensi untuk email ini.</td></tr>`;
        return;
      }

      const groupedByDate = {};
      filtered.forEach(item => {
        const dateKey = item.date;
        if (!groupedByDate[dateKey]) {
          groupedByDate[dateKey] = { date: dateKey, inTime: null, outTime: null };
        }
        
        if (item.inTime && item.inTime !== '-') {
          groupedByDate[dateKey].inTime = item.inTime;
        }
        if (item.outTime && item.outTime !== '-') {
          groupedByDate[dateKey].outTime = item.outTime;
        }
      });

      const daysArray = Object.values(groupedByDate).reverse().slice(0, 7);

      let html = "";
      daysArray.forEach(row => {
        const hasIn = row.inTime && row.inTime !== '-';
        const hasOut = row.outTime && row.outTime !== '-';
        
        let statusIcon = "";
        if (hasIn && hasOut) {
          statusIcon = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 font-bold" title="Lengkap">✓</span>`;
        } else {
          statusIcon = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-100 text-amber-600 font-bold" title="Belum Lengkap">!</span>`;
        }

        html += `
          <tr class="hover:bg-slate-50/50 transition-colors">
            <td class="p-3.5 font-medium text-slate-700">${row.date}</td>
            <td class="p-3.5 text-emerald-600 font-semibold">${hasIn ? row.inTime : '-'}</td>
            <td class="p-3.5 text-indigo-600 font-semibold">${hasOut ? row.outTime : '-'}</td>
            <td class="p-3.5 text-center">${statusIcon}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
